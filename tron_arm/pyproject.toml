[project]
name = "tron_arm"
version = "0.1.0"
description = "TRON 2 dual-arm control from orca_teleop operator wrist poses"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "websockets", "pyyaml"]

[project.optional-dependencies]
# `pytest-xdist` is opt-in: `pytest -n auto --dist loadfile` runs the files in
# parallel (~3x). It is deliberately NOT in addopts so a plain `pytest` keeps
# working for anyone who has not synced this extra.
dev = ["pytest", "hypothesis", "pytest-xdist>=3.6"]
# For tests/test_integration_pipeline.py and tools/run_arm.py. orca_teleop is NOT a
# runtime dependency of this package: the mock, the CLI and the sink maths all import
# without it. The arm path needs only grpcio+protobuf, not torch.
teleop = ["grpcio>=1.62.3", "protobuf>=4.25.9,<5"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tron_arm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end runs that wait on real wall-clock dropout/epoch cycles",
]
filterwarnings = ["error::DeprecationWarning:tron_arm.*"]
